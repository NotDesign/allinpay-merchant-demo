name: Verify and deploy complete AllinPay backoffice
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run setup
      - run: npm run build:pages
      - run: npx playwright install --with-deps chromium
      - name: Verify complete backoffice and BR integration
        run: |
          npm run serve > /tmp/allinpay-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4321/backoffice.html > /dev/null; then break; fi
            sleep 1
          done
          npm test
          npm run test:extra
          npm run test:onboarding
          npm run test:products
          npm run test:risk
          npm run test:br
          npm run test:feedback
          npm run test:external
          node verify-internal-review.cjs
        env:
          DEMO_URL: http://127.0.0.1:4321/backoffice.html
      - name: Check out the immutable October 9 release
        uses: actions/checkout@v4
        with:
          ref: 896fe605744fd0a39a0d06da9b1cd0617255ddcb
          path: .release-archive
      - name: Build the frozen release without changing its source
        working-directory: .release-archive
        run: |
          npm ci --ignore-scripts
          npm run setup
          npm run build:pages
        env:
          GITHUB_SHA: 896fe605744fd0a39a0d06da9b1cd0617255ddcb
      - name: Add the fixed Demo and ZIP to Pages
        run: node scripts/append-frozen-release.mjs .release-archive/_pages
      - name: Verify both pinned versions and their downloadable ZIPs
        run: node scripts/verify-release.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
      - uses: actions/deploy-pages@v5
        id: deployment
