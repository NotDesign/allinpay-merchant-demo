name: Verify and deploy complete AllinPay backoffice
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run setup
      - run: npm run build:pages
      - run: npx playwright install --with-deps chromium
      - name: Verify complete backoffice and BR integration
        run: |
          npm run serve > /tmp/allinpay-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4321/backoffice.html > /dev/null; then break; fi
            sleep 1
          done
          npm test
          npm run test:extra
          npm run test:onboarding
          npm run test:br
        env:
          DEMO_URL: http://127.0.0.1:4321/backoffice.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
      - uses: actions/deploy-pages@v5
        id: deployment
